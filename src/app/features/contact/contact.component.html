<section id="contacto" class="contact">
  <div class="container">
    <app-section-head
      chip="Contáctanos"
      heading="¿Listo para darle mantenimiento a tu flota?"
      text="Dos sedes para atenderte. Contáctanos por WhatsApp, correo o visítanos en el taller más cercano."
      marginBottom="40px"
    />

    <div class="contact-sedes reveal">
      @for (sede of sedes; track sede.name) {
        <div class="sede-card">
          <div class="sede-card-head">
            <div class="sede-dot"></div>
            <span class="sede-name">{{ sede.name }}</span>
            <span class="sede-badge">{{ sede.badge }}</span>
          </div>
          <div class="company-lbl">{{ sede.company }}</div>

          <ul class="contact-list">
            <li>
              <div class="ic">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </div>
              <div>
                <div class="lbl">Correo</div>
                <a [href]="'mailto:' + sede.email" class="val">{{ sede.email }}</a>
              </div>
            </li>
            <li>
              <div class="ic">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </div>
              <div>
                <div class="lbl">Horario</div>
                <div class="val">{{ sede.schedule }}</div>
              </div>
            </li>
            <li>
              <div class="ic">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              </div>
              <div>
                <div class="lbl">Dirección</div>
                <div class="val">{{ sede.address }}</div>
              </div>
            </li>
          </ul>

          <a [href]="sede.mapUrl" target="_blank" rel="noopener" class="map-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Ver en Google Maps
          </a>

          <div class="wa-btns-row">
            @for (wa of sede.whatsapps; track wa.href) {
              <app-wa-button [href]="wa.href" [label]="wa.label" />
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
