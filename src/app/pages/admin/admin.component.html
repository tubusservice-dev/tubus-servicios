<section class="admin-page">
  <div class="container">
    <div class="admin-header">
      <h4>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Panel de Galería
        <span>Admin</span>
      </h4>
    </div>

    <div class="admin-slides-list">
      @for (slide of slides(); track $index) {
        <div class="admin-slide-row">
          <div class="admin-slide-num">{{ $index + 1 }}</div>
          <input
            class="admin-input"
            type="url"
            placeholder="URL de imagen (https://...)"
            [(ngModel)]="slide.url"
          />
          <input
            class="admin-input"
            type="text"
            placeholder="Título del slide"
            [(ngModel)]="slide.title"
          />
          <div class="admin-slide-actions">
            <button
              class="admin-action-btn move"
              type="button"
              title="Subir"
              [disabled]="$index === 0"
              (click)="moveSlide($index, -1)"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
            </button>
            <button
              class="admin-action-btn move"
              type="button"
              title="Bajar"
              [disabled]="$index === slides().length - 1"
              (click)="moveSlide($index, 1)"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <button
              class="admin-action-btn"
              type="button"
              title="Eliminar"
              (click)="removeSlide($index)"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </div>
        </div>
      }
    </div>

    <div class="admin-row-bottom">
      <button class="admin-btn-add" type="button" (click)="addSlide()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Agregar imagen
      </button>
      <button class="admin-btn-save" type="button" (click)="save()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Guardar cambios
      </button>
      @if (saved()) {
        <span class="admin-save-msg visible">✓ Cambios guardados</span>
      }
    </div>
  </div>
</section>
